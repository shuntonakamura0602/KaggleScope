[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "kagglescope-etl"
version = "0.1.0"
description = "Meta Kaggle ingestion pipeline for KaggleScope"
requires-python = ">=3.12"
dependencies = [
  "kaggle>=1.7.4",
  "polars>=1.33,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools]
packages = ["etl"]
package-dir = { etl = "." }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
